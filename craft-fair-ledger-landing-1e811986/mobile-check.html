note\">Opens the Wessling Digital product page on Gumroad.</p>\n        </div>\n        <div class=\"art\" aria-hidden=\"true\">\n          <div class=\"sun\"></div>\n          <div class=\"paper paper-back\"></div>\n          <div class=\"paper paper-front\">\n            <div class=\"paper-top\"><span>WD</span><span>CRAFT FAIR</span></div>\n            <div class=\"paper-title\">Ledger<span>.</span></div>\n            <div class=\"ruled-lines\"></div>\n            <div class=\"paper-bottom\">WESSLING DIGITAL</div>\n          </div>\n          <span class=\"art-caption\">Decorative illustration · not a product preview</span>\n        </div>\n      </section>\n      <section class=\"worked-example\" aria-labelledby=\"example-title\">\n        <p class=\"eyebrow\">A hypothetical worked example</p>\n        <h2 id=\"example-title\">10 sales cover these event costs.</h2>\n        <p>This example explains the arithmetic only; it is not a preview of the paid product or a customer result.</p>\n        <p>Imagine paying an $80 stall fee and $20 for travel. You sell each item for $15, with a $5 variable cost per item sold.</p>\n        <ol class=\"calculation-steps\">\n          <li><h3>Add the event costs</h3><p>$80 stall fee + $20 travel = <strong>$100 in event costs</strong>.</p></li>\n          <li><h3>Find the contribution per item</h3><p>$15 selling price − $5 variable cost = <strong>$10 contribution per item</strong>. This is the amount left from each sale to put toward the event costs.</p></li>\n          <li><h3>Work out the sales needed</h3><p>$100 event costs ÷ $10 contribution = <strong>10 sales to cover those event costs</strong>.</p></li>\n        </ol>\n        <p class=\"example-check\">At 10 sales: $150 in sales revenue − $50 in variable costs − $100 in event costs = $0 left over.</p>\n        <aside class=\"example-limit\" aria-labelledby=\"limit-title\"><h3 id=\"limit-title\">Your working time and other expenses still count.</h3><p>This example excludes c
